schema_version: "1"

# ===========================================================================
# omadia Facilitator (Convener) — agent plugin (#330 Workstream C, Slice C1)
# ---------------------------------------------------------------------------
# ONE Convener identity with modes (facilitate / record / timekeep), never a
# bot per function. Consumes the #330 kernel seams: ephemeral Conductor runs
# (Workstream A), group-conversation primitives + targeted delivery (B1/B2).
# All kernel services are optional_requires — the kernel provides them, no
# plugin does, so a hard `requires` would be unresolvable and keep this
# plugin from ever activating (see plugin-api targetedSend.ts header).
# ===========================================================================

identity:
  id: "@omadia/agent-facilitator"
  kind: "agent"
  domain: "facilitation"
  name: "omadia Facilitator"
  version: "0.2.0"
  description: "Moderiert Gruppen-Chats zu einem definierten Ergebnis wie ein professioneller Facilitator: erkennt die eigene Einladung, startet einen ephemeren Conductor-Workflow mit Ziel + Definition-of-Done, moderiert transparent (announced start/stop, /facilitator status) und berichtet Ergebnis oder Abbruch an den Initiator."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "facilitation"
    - "collaboration"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

multi_instance: true
privacy_class: "strict"

depends_on: []

# Kernel-published services (#330 A/B1). optional_requires by design: the
# plugin activates without them and degrades with clear status messages —
# and the deny-by-default service gate grants exactly what is declared here.
# Least privilege: exactly the services this slice consumes. The C2a setup
# services power the zero-touch flow (agent provisioning, invite-guarded
# auto-bind, per-conversation initiator roles); conversationRosters resolves
# the inviter's email (role holders are email-keyed). memoryStore joins with
# the durable-state slice.
optional_requires:
  - "conductorEphemeralRuns@1"
  - "targetedSend@1"
  - "conversationEvents@1"
  - "agentProvisioning@1"
  - "conversationBindings@1"
  - "conductorRoleAssignments@1"
  - "conversationRosters@1"

lifecycle:
  entry: "dist/plugin.js"
  hooks:
    onInstall: false
    onConfigure: true
    onActivate: true
    onDeactivate: true
    onUninstall: true
  uninstall_policy:
    entities: "quarantine"
    memory: "delete"
    secrets: "delete"

setup:
  fields:
    - key: "facilitator_agent_slug"
      type: "string"
      label: "Facilitator-Agent-Slug"
      help: "Slug des Top-Level-Agenten, der die Moderation fährt (der Agent, den der Operator anlegt und auf die Gruppen-Conversation bindet). Wird als agents:facilitator-Slot in das facilitation-Pattern eingesetzt."
      required: false
      default: "facilitator"
    - key: "initiator_role_key"
      type: "string"
      label: "Initiator-Rolle (Conductor role key)"
      help: "Conductor-Rolle, deren aktuelle Holder das Ergebnis bestätigen und die Reports empfangen (roles:initiator-Slot + targetedSend-Ziel 'role:<key>'). Die Holder pflegt der Operator über die Conductor-Rollen-API."
      required: false
      default: "facilitation-initiator"
    - key: "report_channel_type"
      type: "string"
      label: "Report-Channel-Typ"
      help: "channel_bindings.channel_type, über den Bestätigung + Report zugestellt werden (channels:report-Slot und targetedSend-channelType). Step 1: 'teams'."
      required: false
      default: "teams"
    - key: "default_ttl_hours"
      type: "number"
      label: "Standard-TTL (Stunden)"
      help: "Lebensdauer des ephemeren Facilitation-Workflows, wenn beim Start keine angegeben wird. Der Kernel clamped auf seine CONDUCTOR_EPHEMERAL_*-Grenzen (Default max 7 Tage)."
      required: false
      default: 24
    - key: "reporting_mode"
      type: "string"
      label: "Reporting-Modus"
      help: "'result-only' (Default): nur Endergebnis/Abbruch an den Initiator. 'interim': zusätzlich Zwischenstände, wenn der Agent sie über das facilitation_report-Verhalten anstößt."
      required: false
      default: "result-only"
    - key: "moderation_style"
      type: "string"
      label: "Moderations-Stil"
      help: "Freitext-Hinweis an den Moderations-Prompt (z.B. 'zurückhaltend, nur bei Stillstand eingreifen' oder 'aktiv strukturierend mit Timeboxing')."
      required: false
      default: "aktiv strukturierend, aber knapp — eingreifen bei Stillstand, Dominanz einzelner oder Zielabweichung"
    - key: "language"
      type: "string"
      label: "Sprache"
      help: "Sprache der Moderation und der Reports ('de' oder 'en')."
      required: false
      default: "de"
    - key: "auto_setup"
      type: "boolean"
      label: "Zero-Touch-Setup"
      help: "Default true: Beim Aktivieren wird der Top-Level-Agent automatisch provisioniert (inkl. Playbook-Persona), Gruppen-Einladungen binden die Conversation automatisch und der Einladende wird als Initiator-Rolle gesetzt. Auf false stellen, wenn der Operator Agent/Binding/Rolle manuell verwalten will."
      required: false
      default: true
    - key: "disclose_report_target"
      type: "boolean"
      label: "Report-Ziel offenlegen"
      help: "Default true: Die Gruppe erfährt im Opening-Handshake, an wen berichtet wird (Transparenz-/DSGVO-Default aus #330). Nur ändern, wenn eine andere Rechtsgrundlage greift."
      required: false
      default: true
  self_test: false

llm:
  prefers:
    - capabilities: ["tool_use", "long_context"]
      min_context: 100000
      class: "frontier"
      temperature_hint: 0.4
  fallback_allowed: true

capabilities: []

playbook:
  when_to_use: |
    Wenn eine Gruppe in einem Chat zu einem definierten Ergebnis moderiert
    werden soll: Rollenverteilungen, Entscheidungen, Priorisierungen,
    Retro-Ergebnisse. Der Facilitator wird sichtbar in die Konversation
    eingeladen, startet die Facilitation mit Ziel + machine-checkable
    Definition-of-Done (facilitation_start) und berichtet das Ergebnis an
    den Initiator. Statusfragen ("werden wir moderiert? von wem? wohin geht
    der Report?") beantwortet facilitation_status jederzeit wahrheitsgemäß.
  combines_with: []
  not_for:
    - "Verdeckte Moderation oder stilles Mitschneiden — Start/Stop sind immer announced, das Report-Ziel wird per Default offengelegt."
    - "1:1-Assistenz ohne Gruppenziel — dafür ist der normale Front-Door-Agent da."
    - "Audio-/Online-Meetings (Step 2 des Epics, nicht Teil dieses Plugins)."
  example_prompts:
    - "Start der Facilitation — Ziel: Alle Rollen im Dokument sind mit je genau einem Namen besetzt. DoD: Jede Rolle hat einen bestätigten Namen und die Gruppe hat zugestimmt."
    - "/facilitator status"
    - "/facilitator stop"

entities:
  produces: []
  consumes: []

skills:
  - id: "runtime-note"
    kind: "prompt_partial"
    path: "skills/runtime-note.md"
    description: "Beschreibt die in-process Laufzeit und die drei facilitation_*-Tools — überschreibt Playbook-Annahmen."
    shareable: false
  - id: "facilitator-playbook"
    kind: "prompt_partial"
    path: "skills/facilitator-playbook.md"
    description: "Convener-Playbook: Moderationstechniken, Transparenzregeln, Tool-Protokoll, Step-Modus für die Pattern-Prompts."
    shareable: false

permissions:
  # C1 keeps facilitation state in-memory — no memory grants until the C2
  # persistence actually reads/writes them (least privilege).
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound: []
  filesystem:
    scratch: false

integrations: []

ui:
  settings_schema: null
  commands: []
  dashboard_cards: []
