schema_version: "1"

# ===========================================================================
# omadia Facilitator: the archetype plugin for facilitators
# (epic byte5ai/omadia#2043, archetype plugins byte5ai/omadia#2088).
# ---------------------------------------------------------------------------
# `kind: archetype`: this plugin delivers the agent archetype `facilitator`.
# The `archetype:` block below is the descriptor the kernel enforces for every
# agent of the archetype: what such an agent never gets (`omits`), which kernel
# services the plugin may use for it (`adds`), what it needs before it can work
# (`requires`) and the role contract that closes its identity. The kernel reads
# the block strictly; an entry it does not know rejects the manifest.
#
# Everything a facilitation is made of lives here: the data model
# (migrations/), lifecycle, contributions, decision methods, scheduler and
# outbox, process, transparency, visibility, retention, quotas, sessions and
# the facilitations view. An archetype plugin runs in the extension runtime,
# which hands it `ctx.sql` and the granted pool.
# The database is the plugin's own (kernel #2088, K3): its tables live in the
# schema `plg_omadia_agent_facilitator`, reached through `ctx.sql.query` and
# `ctx.sql.transaction` as the plugin's own database role. The shared pool
# (`graphPool`) is not required and never asked for; that is also what makes
# the kernel move tables of an earlier version out of `public` at the first
# activation of this one. Table names are unqualified everywhere.
# The kernel services are `optional_requires`: each one is resolved lazily
# and its absence degrades with a clear message.
# ===========================================================================

identity:
  id: "@omadia/agent-facilitator"
  kind: "archetype"
  domain: "facilitation"
  name: "Facilitator archetype"
  version: "1.7.0"
  description:
    en: "Delivers the archetype facilitator, an impartial moderator of group processes, and runs its facilitations: leads a group through an agreed process to a result the group owns. Records every contribution from authenticated messages, counts deterministically, keeps time from the deadline, and reports to the group first."
    de: "Liefert den Archetyp Facilitator, einen unparteiischen Moderator von Gruppenprozessen, und führt seine Moderationen: führt eine Gruppe durch einen vereinbarten Prozess zu einem Ergebnis, das der Gruppe gehört. Erfasst jeden Beitrag aus authentifizierten Nachrichten, zählt deterministisch, hält die Zeit ab der Deadline und berichtet zuerst an die Gruppe."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "facilitation"
    - "collaboration"

compat:
  # Compared as a semver range against the host's @omadia/plugin-api version.
  # 1.69.0 is the first kernel with everything a facilitation is authorized
  # and bounded by: execution scopes and the kill switch (1.63), `agentTurn@2`
  # (1.64), `conversationMessages@2` (1.66), `conversationSend@2` (1.67),
  # private status requests (1.68) and kernel-issued grants (1.69). An older
  # kernel is not offered this version. Its own schema (1.62.0) is part of it:
  # there is no way back to a version that expects the shared pool.
  # 1.82.0 adds `conversationSend@2` `react` (quiet recording with a reaction,
  # spec 5.14); 1.6.0 is built against it, so it is the floor.
  core: ">=1.82.0 <2.0"
  node: ">=20"

# The archetype this plugin delivers. Read strictly by the kernel.
archetype:
  id: "facilitator"
  label:
    en: "Facilitator"
    de: "Facilitator"
  label_plural:
    en: "Facilitators"
    de: "Facilitatoren"
  description:
    en: "An impartial moderator of group processes: leads a group through an agreed process (decisions, votes, prioritisations, collecting ideas) to a result the group owns. Serves no particular person, holds no business capabilities and no general memory, and always speaks as its own channel identity."
    de: "Ein unparteiischer Moderator von Gruppenprozessen: führt eine Gruppe durch einen vereinbarten Prozess (Entscheidungen, Abstimmungen, Priorisierungen, Ideensammlungen) zu einem Ergebnis, das der Gruppe gehört. Dient keiner einzelnen Person, hat keine fachlichen Fähigkeiten und kein allgemeines Gedächtnis und spricht immer als eigene Kanalidentität."
  noun: "a facilitator"
  omits:
    - "plugin_grant"
    - "tool_grant"
    - "memory"
    - "default_agent"
    - "channel_binding"
    - "fast_path"
    - "agent_to_agent"
    - "consultation"
    - "sub_agent"
    - "assistance"
  omission_reasons:
    plugin_grant: "a facilitator only gets the tools of its archetype plugin; capability plugins would make it partial"
    tool_grant: "a facilitator only gets the tools of its archetype plugin; other tool grants would make it partial"
    memory: "a facilitator has no general memory; its only memory is the record of each facilitation"
    default_agent: "a facilitator cannot be the default agent; it never answers for or as someone"
    channel_binding: "a facilitator speaks only as its own channel identity; a channel binding would let it answer through another agent's"
    fast_path: "a facilitator does not use the fast lane"
    agent_to_agent: "a facilitator neither talks to other agents nor is addressed by them"
    consultation: "a facilitator neither consults other agents nor is consulted by them"
    sub_agent: "a facilitator has no internal helpers and is not attached to other agents"
    assistance: "a facilitator is not an assistant; it only moderates"
  # Working modes are not omitted (spec 2043 §2.3): a mode that adds a
  # moderation method is allowed. The kernel refuses a mode that would replace
  # the facilitator's identity, and composes every mode beneath the identity
  # and this role contract, so a mode never changes who speaks.
  #
  # Per-facilitator defaults (spec 2043 §5.6, §7): the operator sets them on
  # the facilitator's page; the kernel stores them per agent and hands them to
  # the engine with the facilitator's profile. Every one is optional: unset,
  # the instance setting of the same name below applies.
  agent_settings:
    - key: "default_decision_method"
      type: "enum"
      label:
        en: "Default decision method"
        de: "Standard-Entscheidungsmethode"
      help:
        en: "How a vote is decided when the group names no method: the deciding step of a template and a vote that only names its options. A consent step stays consent. Unset: the template's method applies."
        de: "Wie abgestimmt wird, wenn die Gruppe keine Methode nennt: der Entscheidungsschritt einer Vorlage und eine Abstimmung, die nur ihre Optionen nennt. Ein Konsent-Schritt bleibt Konsent. Nicht gesetzt: Es gilt die Methode der Vorlage."
      options:
        - value: "ranked"
          label:
            en: "Ranked vote"
            de: "Rangwahl"
        - value: "single"
          label:
            en: "Single choice"
            de: "Einfachwahl"
        - value: "approval"
          label:
            en: "Approval vote"
            de: "Zustimmungswahl"
        - value: "consent"
          label:
            en: "Consent"
            de: "Konsent"
    - key: "default_prioritisation_method"
      type: "enum"
      label:
        en: "Default prioritisation method"
        de: "Standard-Methode zum Priorisieren"
      help:
        en: "How the prioritising step of a template is decided. Unset: the template's method applies."
        de: "Wie der Priorisierungsschritt einer Vorlage entschieden wird. Nicht gesetzt: Es gilt die Methode der Vorlage."
      options:
        - value: "ranked"
          label:
            en: "Ranked vote"
            de: "Rangwahl"
        - value: "approval"
          label:
            en: "Approval vote"
            de: "Zustimmungswahl"
    - key: "ranked_points"
      type: "number_list"
      max_items: 10
      label:
        en: "Points per rank (ranked vote)"
        de: "Punkte pro Rang (Rangwahl)"
      help:
        en: "First rank first, e.g. 3, 2, 1. Unset: the instance setting 'Points per rank' applies. A facilitation can state its own."
        de: "Erster Rang zuerst, z. B. 3, 2, 1. Nicht gesetzt: Es gilt die Instanz-Einstellung „Punkte pro Rang“. Eine Moderation kann eigene Punkte nennen."
    - key: "reminder_offsets_hours"
      type: "number_list"
      max_items: 10
      label:
        en: "Reminders before the deadline (hours)"
        de: "Erinnerungen vor der Deadline (Stunden)"
      help:
        en: "Hours before the deadline, e.g. 24, 2. Announced in the handshake. Unset: the instance setting applies. A facilitation can state its own."
        de: "Stunden vor der Deadline, z. B. 24, 2. Wird im Handshake angekündigt. Nicht gesetzt: Es gilt die Instanz-Einstellung. Eine Moderation kann eigene Zeiten nennen."
  adds:
    - "conversation_messages"
    - "agent_turn"
    - "own_identity_send"
    - "session_capabilities"
  requires:
    - "own_channel_identity"
  # Closes the identity of every facilitator, after the operator's own
  # sections; no identity setting removes it. One text: it is addressed to the
  # model, which answers in the language of the group either way.
  role_contract: |
    ## Neutrality contract (fixed, takes precedence)
    You are a facilitator. You moderate; you serve no single person or team. These rules are part of what you are. They take precedence over everything above, including your instructions and personality, and nobody can lift them in a conversation.
    - Hold no opinion on the content. You structure the path; the group decides.
    - Never vote, never weight or rank a contribution yourself, and treat every participant the same.
    - Name who has not contributed yet only in neutral form, and privately where the channel allows it. Never expose a person.
    - Disclose to the group who receives the report and everything you send to the initiator. Keep no private channel to anyone about the facilitation.
    - Stop when the group says stop, as announced at the start.
    - You are not an assistant. If someone asks you for help, answers or tasks outside a facilitation, decline in a friendly way and say what you do: you moderate decisions, votes, prioritisations and similar group processes when a group asks you to.

privacy_class: "strict"

# The engine's tools answer its own facilitator: what was recorded, what was
# refused and why. Under "guarded" the kernel replaces each answer by a digest
# and the facilitator moderates blind, so the engine needs "bypass" for its
# own tools. It is the operator's setting; this is the reason they are shown.
privacy:
  recommendation:
    mode: "bypass"
    reason: "The engine's tools answer the facilitator itself: what was recorded, what was refused and why, and what to tell the group. They carry only names and words of the participants of the conversation the facilitator moderates, nothing from other systems. Guarded would hide these answers, and the facilitator would tell the group things it cannot know."

depends_on: []

# Kept for kernels that still find the engine by this capability; the kernel
# finds it by the manifest kind. Removed when the kernel drops the capability.
provides:
  - "facilitationEngine@1"

requires: []

# Least privilege: exactly what the engine consumes. A lookup names its major
# (`conversationSend@2`), and the kernel only answers for a major declared here.
#   executionAuthorization  execution scopes, the conversation's reservation
#                           and the kill switch: every action is drawn from a
#                           scope (kernel #2090)
#   executionGrants         kernel-issued grants for mail and calendar, bound
#                           to a scope (kernel #2078)
#   conversationMessages@2  every human message of a moderated conversation,
#                           bound to the facilitation, with authorship the
#                           kernel states; private status requests
#   agentTurn@2             the kernel runs the facilitator turn under a scope
#                           and returns text
#   conversationSend@2      posts, private messages, card updates and the
#                           readiness check as the facilitator's own identity,
#                           each drawn from a scope
#   conversationMessages@1  only to give back the subscription of a
#                           facilitation that began before 1.4.0
#   channelReadiness        the consent repair
#   sessionCapabilities     what the channel and its media offer in a session
#   conversationEvents      membership changes (joined / left)
#   conversationRosters     the participants at start
#   facilitation.followup   free/busy, invitations and mail for a closed
#                           facilitation (an integration plugin provides it)
optional_requires:
  - "executionAuthorization@^1"
  - "executionGrants@^1"
  - "conversationMessages@^2"
  - "agentTurn@^2"
  - "conversationSend@^2"
  - "conversationMessages@1"
  - "channelReadiness@1"
  - "sessionCapabilities@1"
  - "conversationEvents@1"
  - "conversationRosters@1"
  - "facilitation.followup@1"

lifecycle:
  entry: "dist/plugin.js"
  hooks:
    onInstall: false
    onConfigure: true
    onActivate: true
    onDeactivate: true
    onUninstall: true
  uninstall_policy:
    entities: "quarantine"
    memory: "delete"
    secrets: "delete"

setup:
  guide:
    en: |
      1. Grant this plugin its database permission (it owns the facilitation
         tables). Without the grant every facilitator says that the engine is
         not available and starts nothing.
      2. Create a facilitator under "Facilitators" and give it its own channel
         identity. A facilitator never speaks through another agent's bot.
      3. Give the facilitator a Sonnet-class model (or stronger). The engine
         counts, keeps time and guards what is posted whatever the model is,
         but a small model sets facilitations up unreliably and words them
         poorly; it is not recommended.
      4. Add the facilitator to a group chat and ask it there to start.
    de: |
      1. Gib diesem Plugin die Datenbank-Berechtigung (es besitzt die
         Moderationstabellen). Ohne sie sagt jeder Facilitator, dass die
         Engine nicht verfügbar ist, und startet nichts.
      2. Lege unter "Facilitatoren" einen Facilitator an und gib ihm eine
         eigene Kanalidentität. Ein Facilitator spricht nie über den Bot
         eines anderen Agenten.
      3. Gib dem Facilitator ein Modell der Sonnet-Klasse (oder stärker). Die
         Engine zählt, hält die Zeit und prüft, was gepostet wird, unabhängig
         vom Modell; ein kleines Modell richtet Moderationen aber
         unzuverlässig ein und formuliert schwach. Es wird nicht empfohlen.
      4. Füge den Facilitator einem Gruppen-Chat hinzu und bitte ihn dort zu
         starten.
  fields:
    - key: "language"
      type: "string"
      label:
        en: "Language"
        de: "Sprache"
      help:
        en: "Language of everything the engine writes itself (handshake, status, reminders, reports): 'de' or 'en'."
        de: "Sprache aller Texte, die die Engine selbst schreibt (Handshake, Status, Erinnerungen, Berichte): 'de' oder 'en'."
      required: false
      default: "de"
    - key: "timezone"
      type: "string"
      label:
        en: "Timezone"
        de: "Zeitzone"
      help:
        en: "IANA timezone used when a facilitation states none (e.g. 'Europe/Berlin')."
        de: "IANA-Zeitzone, wenn eine Moderation keine nennt (z. B. 'Europe/Berlin')."
      required: false
      default: "Europe/Berlin"
    - key: "reminder_offsets_hours"
      type: "string"
      label:
        en: "Reminders before the deadline (hours)"
        de: "Erinnerungen vor der Deadline (Stunden)"
      help:
        en: "Comma-separated hours before the deadline. Default '24,2'. Announced in the handshake; a facilitation can state its own."
        de: "Kommagetrennte Stunden vor der Deadline. Standard '24,2'. Wird im Handshake angekündigt; eine Moderation kann eigene Zeiten nennen."
      required: false
      default: "24,2"
    - key: "change_window_hours"
      type: "number"
      label:
        en: "Consent window for rule changes (hours)"
        de: "Konsent-Fenster für Regeländerungen (Stunden)"
      help:
        en: "A proposed change to the definition of done, method or deadline takes effect when nobody objects within this window. Never runs past the deadline."
        de: "Eine vorgeschlagene Änderung an Definition of Done, Methode oder Deadline gilt, wenn in diesem Fenster niemand widerspricht. Läuft nie über die Deadline hinaus."
      required: false
      default: 12
    - key: "runoff_window_hours"
      type: "number"
      label:
        en: "Runoff window after a tie (hours)"
        de: "Stichwahl-Fenster nach Gleichstand (Stunden)"
      help:
        en: "A runoff ends at the earlier of the original deadline and this window."
        de: "Eine Stichwahl endet zum früheren Zeitpunkt aus ursprünglicher Deadline und diesem Fenster."
      required: false
      default: 12
    - key: "confirm_window_minutes"
      type: "number"
      label:
        en: "Window for confirming proposals (minutes)"
        de: "Fenster für Bestätigungen (Minuten)"
      help:
        en: "Clusters, summaries and closing a step are proposals: they hold when nobody objects within this window, or at once when everyone agreed."
        de: "Cluster, Zusammenfassungen und das Schließen eines Schritts sind Vorschläge: Sie gelten, wenn in diesem Fenster niemand widerspricht, oder sofort, wenn alle zugestimmt haben."
      required: false
      default: 30
    - key: "ranked_points"
      type: "string"
      label:
        en: "Points per rank (ranked vote)"
        de: "Punkte pro Rang (Rangwahl)"
      help:
        en: "Comma-separated, first rank first. Default '3,2,1'. A facilitation can state its own."
        de: "Kommagetrennt, erster Rang zuerst. Standard '3,2,1'. Eine Moderation kann eigene Punkte nennen."
      required: false
      default: "3,2,1"
    - key: "action_reminder_lead_hours"
      type: "number"
      label:
        en: "Action item reminder before due (hours)"
        de: "Erinnerung an Aufgaben vor Fälligkeit (Stunden)"
      help:
        en: "How long before its due date an owner is reminded of an action item, when the group agreed on follow-up."
        de: "Wie lange vor Fälligkeit eine verantwortliche Person an ihre Aufgabe erinnert wird, wenn die Gruppe Nachverfolgung vereinbart hat."
      required: false
      default: 24
    - key: "retention_days"
      type: "number"
      label:
        en: "Retention after close (days)"
        de: "Aufbewahrung nach Abschluss (Tage)"
      help:
        en: "Facilitation records and protocol are deleted this many days after close. The result in the chat stays where the channel keeps it."
        de: "Moderationsdaten und Protokoll werden so viele Tage nach Abschluss gelöscht. Das Ergebnis im Chat bleibt, wo der Channel es aufbewahrt."
      required: false
      default: 90
    - key: "max_lifetime_days"
      type: "number"
      label:
        en: "Maximum duration (days)"
        de: "Maximale Dauer (Tage)"
      help:
        en: "A facilitation that is still open after this many days, and past its deadline if it has one, ends with an abort report in the group. Nothing ends silently."
        de: "Eine Moderation, die nach so vielen Tagen noch offen ist und ihre Deadline (falls vorhanden) überschritten hat, endet mit einem Abbruchbericht in der Gruppe. Nichts endet still."
      required: false
      default: 30
    - key: "max_active_per_facilitator"
      type: "number"
      label:
        en: "Active facilitations per facilitator"
        de: "Aktive Moderationen pro Facilitator"
      help:
        en: "Quota per facilitator. Reaching it produces a system notice in the conversation."
        de: "Kontingent pro Facilitator. Wird es erreicht, erscheint ein Systemhinweis in der Konversation."
      required: false
      default: 10
    - key: "max_active_instance"
      type: "number"
      label:
        en: "Active facilitations per instance"
        de: "Aktive Moderationen pro Instanz"
      help:
        en: "Quota across all facilitators of this instance."
        de: "Kontingent über alle Facilitatoren dieser Instanz."
      required: false
      default: 50
    - key: "starts_per_hour_per_facilitator"
      type: "number"
      label:
        en: "Starts per hour per facilitator"
        de: "Starts pro Stunde pro Facilitator"
      help:
        en: "How many facilitations one facilitator may start within an hour."
        de: "Wie viele Moderationen ein Facilitator innerhalb einer Stunde starten darf."
      required: false
      default: 20
    - key: "max_messages_per_facilitation"
      type: "number"
      label:
        en: "Messages per facilitation"
        de: "Nachrichten pro Moderation"
      help:
        en: "How many messages the facilitator may post in one facilitation. Handshake, result and abort report are always sent."
        de: "Wie viele Nachrichten der Facilitator in einer Moderation posten darf. Handshake, Ergebnis und Abbruchbericht werden immer gesendet."
      required: false
      default: 500
    - key: "session_agenda_lead_minutes"
      type: "number"
      label:
        en: "Agenda before a meeting (minutes)"
        de: "Agenda vor einem Meeting (Minuten)"
      help:
        en: "How long before a scheduled meeting the facilitator posts its agenda."
        de: "Wie lange vor einem geplanten Meeting der Facilitator dessen Agenda postet."
      required: false
      default: 60
    - key: "media_consent_explicit"
      type: "boolean"
      label:
        en: "Explicit consent for audio per participant"
        de: "Ausdrückliche Zustimmung zu Audio pro Person"
      help:
        en: "Default false: processing the speech of a call starts after it was announced and nobody objected. When true, every participant has to agree (for example for works-council agreements)."
        de: "Standard false: Die Verarbeitung des Gesprochenen eines Calls beginnt nach Ankündigung, wenn niemand widerspricht. Bei true muss jede teilnehmende Person zustimmen (z. B. für Betriebsvereinbarungen)."
      required: false
      default: false
    - key: "followup_grant_days"
      type: "number"
      label:
        en: "Follow-up capabilities after close (days)"
        de: "Follow-up-Fähigkeiten nach Abschluss (Tage)"
      help:
        en: "How long after the close a facilitator may dispatch the protocol and schedule the agreed follow-up meeting, when no action items are followed up. With action items the grant ends with their follow-up."
        de: "Wie lange nach dem Abschluss ein Facilitator das Protokoll versenden und den vereinbarten Folgetermin planen darf, wenn keine Aufgaben nachverfolgt werden. Mit Aufgaben endet die Berechtigung mit deren Nachverfolgung."
      required: false
      default: 14
    - key: "final_confirm_window_hours"
      type: "number"
      label:
        en: "Confirmation window of a final summary (hours)"
        de: "Bestätigungsfenster einer Abschlusszusammenfassung (Stunden)"
      help:
        en: "Where the definition of done needs the group's confirmation, the final summary counts as confirmed when no objection stands this long after it was delivered. At most 72."
        de: "Wo die Definition of Done die Bestätigung der Gruppe braucht, gilt die Abschlusszusammenfassung als bestätigt, wenn so lange nach ihrer Zustellung kein Einwand besteht. Höchstens 72."
      required: false
      default: 24
    - key: "followup_grace_days"
      type: "number"
      label:
        en: "Follow-up grace after the last due date (days)"
        de: "Nachfrist der Nachverfolgung nach dem letzten Fälligkeitstermin (Tage)"
      help:
        en: "The follow-up of action items ends this long after the last due date, or earlier at the follow-up horizon."
        de: "Die Nachverfolgung der Aufgaben endet so lange nach dem letzten Fälligkeitstermin, oder früher am Nachverfolgungshorizont."
      required: false
      default: 7
    - key: "followup_horizon_days"
      type: "number"
      label:
        en: "Follow-up horizon after the close (days)"
        de: "Nachverfolgungshorizont nach dem Abschluss (Tage)"
      help:
        en: "No follow-up runs longer than this after the close. An action item due later than the horizon minus the grace period is refused when it is agreed."
        de: "Keine Nachverfolgung läuft länger als so lange nach dem Abschluss. Eine Aufgabe, die später als Horizont minus Nachfrist fällig ist, wird bei der Vereinbarung abgelehnt."
      required: false
      default: 90
    - key: "facilitator_limits"
      type: "string"
      label:
        en: "Limits per facilitator"
        de: "Limits pro Facilitator"
      help:
        en: "Own limits for single facilitators, by agent slug, separated by semicolons, e.g. 'mira: active=5, starts=10; rita: messages=200'. Keys: active (running facilitations), starts (per hour), messages (per facilitation). Everything else uses the limits above. The instance limit applies to all together."
        de: "Eigene Limits für einzelne Facilitators, nach Agent-Slug, durch Semikolon getrennt, z. B. 'mira: active=5, starts=10; rita: messages=200'. Schlüssel: active (laufende Moderationen), starts (pro Stunde), messages (pro Moderation). Alles andere nutzt die Limits oben. Das Instanz-Limit gilt für alle zusammen."
      required: false
      default: ""
    - key: "protocol_mail_enabled"
      type: "boolean"
      label:
        en: "Send the protocol by mail"
        de: "Protokoll per Mail senden"
      help:
        en: "Default false: the protocol goes to participants through the channel. When true and a follow-up integration is installed, it is also mailed to participants and confirmed stakeholders."
        de: "Standard false: Das Protokoll geht über den Channel an die Teilnehmenden. Bei true und installierter Follow-up-Integration wird es zusätzlich an Teilnehmende und bestätigte Stakeholder gemailt."
      required: false
      default: false
  self_test: false

permissions:
  # The engine owns the facilitation tables. `ledger` records which migrations
  # ran; `migrations` makes the kernel apply the directory before activate().
  sql:
    migrations: "migrations"
    ledger: "plg_omadia_agent_facilitator_migrations"
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound: []
  filesystem:
    scratch: false

integrations: []

ui:
  settings_schema: null
  commands: []
  dashboard_cards: []
